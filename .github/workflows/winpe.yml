on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Download ADK
        run: aria2c -i url.txt -d download -j 8 -x 8 -s 8 -k 1M

      - name: Install ADK
        run: .\download\adksetup.exe /quiet

      - name: Install WinPE add-on
        run: .\download\adkwinpesetup.exe /quiet

      - name: Build WinPE
        shell: pwsh
        run: |
          $adkPath = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Assessment and Deployment Kit"
          $copype = Get-ChildItem $adkPath -Filter copype.cmd -Recurse | Select-Object -First 1
          $makeWinPEMedia = Get-ChildItem $adkPath -Filter MakeWinPEMedia.cmd -Recurse | Select-Object -First 1
          if (!$copype -or !$makeWinPEMedia) { throw "WinPE build scripts not found under $adkPath." }
          $workPath = Join-Path $env:RUNNER_TEMP "WinPE_amd64"
          $isoPath = Join-Path $env:RUNNER_TEMP "WinPE_amd64.iso"

          & $copype.FullName amd64 $workPath
          if ($LASTEXITCODE -ne 0) { throw "copype failed with exit code $LASTEXITCODE." }

          & $makeWinPEMedia.FullName /ISO $workPath $isoPath
          if ($LASTEXITCODE -ne 0) { throw "MakeWinPEMedia failed with exit code $LASTEXITCODE." }

      - name: Upload WinPE
        uses: actions/upload-artifact@v4
        with:
          name: winpe-amd64
          path: ${{ runner.temp }}\WinPE_amd64.iso
          if-no-files-found: error
