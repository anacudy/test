on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Download ADK
        run: aria2c -i url.txt -d download -j 8 -x 8 -s 8 -k 1M

      - name: Install ADK
        run: .\download\adksetup.exe /quiet /installpath "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit" /features OptionId.DeploymentTools

      - name: Install WinPE add-on
        run: .\download\adkwinpesetup.exe /quiet /installpath "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit" /features OptionId.WindowsPreinstallationEnvironment

      - name: Build WinPE
        shell: cmd
        run: call "%ProgramFiles(x86)%\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\copype.cmd" amd64 "%RUNNER_TEMP%\WinPE_amd64" && call "%ProgramFiles(x86)%\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\MakeWinPEMedia.cmd" /ISO "%RUNNER_TEMP%\WinPE_amd64" "%RUNNER_TEMP%\WinPE_amd64.iso"

      - name: Upload WinPE
        uses: actions/upload-artifact@v4
        with:
          name: winpe-amd64
          path: ${{ runner.temp }}\WinPE_amd64.iso
          if-no-files-found: error
