name: Build WinPE ISO

on:
  push:
    tags:
      - "v*" # 推送 v1.0.0 这类 tag 时触发
  workflow_dispatch: # 也支持手动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 上传 Release 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ADK (Deployment Tools)
        run: choco install windows-adk-deploy -y --ignore-dependencies

      - name: Install WinPE add-on
        run: choco install windows-adk-winpe -y

      - name: Build WinPE ISO
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\DandISetEnv.bat"
          copype amd64 C:\WinPE_amd64
          MakeWinPEMedia /ISO /f C:\WinPE_amd64 "${{ github.workspace }}\WinPE_amd64.iso" /bootex
          echo Build finished.
          dir "${{ github.workspace }}\WinPE_amd64.iso"

      - name: Upload ISO to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: WinPE_amd64.iso
          name: WinPE ${{ github.ref_name }}
          body: |
            Windows PE ISO built with ADK.
            - Architecture: amd64
            - /bootex (Windows UEFI CA 2023 signed)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
