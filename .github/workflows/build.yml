on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # - name: Download
      #   run: aria2c -i url.txt -d download -j 8 -x 8 -s 8 -k 1M

      - name: Install
        run: choco install -y windows-adk-deploy

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\DandISetEnv.bat"
          call copype amd64 D:\WinPE
          call MakeWinPEMedia /ISO D:\WinPE D:\WinPE.iso /bootex

      - name: Hash
        run: Get-FileHash D:\WinPE.iso SHA1

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: D:\WinPE.iso
          compression-level: 9
