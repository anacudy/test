on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download
        run: aria2c -i url.txt -d download -j 8 -x 8 -s 8 -k 1M

      - name: Install
        run: |
          download/adksetup.exe /q /installpath d:/adk /features OptionId.DeploymentTools
          download/adkwinpesetup.exe /q /installpath d:/adk

      - name: Build
        shell: cmd
        run: |
          call "D:/adk/Assessment and Deployment Kit/Deployment Tools/DandISetEnv.bat"
          copype amd64 D:/WinPE
          MakeWinPEMedia /ISO D:/WinPE D:/WinPE/WinPE.iso /bootex

      - name: Hash
        run: Get-FileHash D:/WinPE/WinPE.iso SHA1

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: D:/WinPE/WinPE.iso
          compression-level: 9
