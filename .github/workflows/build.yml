          # download/adksetup.exe /q /installpath D:/adk /l D:/adk/adksetup.log /features OptionId.DeploymentTools
          # download/adkwinpesetup.exe /q /installpath D:/adk /l D:/adk/adkwinpesetup.log
          choco install -y windows-adk-deploy windows-adk-winpe

